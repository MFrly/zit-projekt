<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontakt | BoulderZone</title>
<meta name="description" content="Napište nám a domluvte si první lezení.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html"><span>Boulder</span>Zone</a>
    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="site-nav" id="site-nav" aria-label="Hlavní navigace">
      <ul>
        <li><a href="index.html">Úvod</a></li>
        <li><a href="techniky.html">Techniky</a></li>
        <li><a href="stupnice.html">Stupnice</a></li>
        <li><a href="kontakt.html" aria-current="page">Kontakt</a></li>
      </ul>
    </nav>
  </div>
</header>
<main>
  <div class="wrap page-title">
    <h1>Kontakt</h1>
    <p>Chceš si domluvit první lezení nebo se na něco zeptat? Vyplň formulář.</p>
  </div>
  <section>
    <div class="wrap">
      <form id="contact-form" class="tool" novalidate>
        <label for="name">Jméno</label>
        <input id="name" name="name" type="text" autocomplete="name">
        <p class="error" id="err-name" aria-live="polite"></p>

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email">
        <p class="error" id="err-email" aria-live="polite"></p>

        <label for="level">Tvoje úroveň</label>
        <select id="level" name="level">
          <option value="">Vyber…</option>
          <option>Nikdy jsem nelezl</option>
          <option>Začátečník</option>
          <option>Pokročilý</option>
        </select>
        <p class="error" id="err-level" aria-live="polite"></p>

        <label for="message">Zpráva</label>
        <textarea id="message" name="message" rows="5"></textarea>
        <p class="error" id="err-message" aria-live="polite"></p>

        <button class="btn" type="submit">Odeslat zprávu</button>
        <p id="form-status" class="status" role="status"></p>
      </form>
    </div>
  </section>
</main>
<footer class="site-footer">
  <div class="wrap"><p>BoulderZone – školní projekt, VŠB-TUO, FEI.</p></div>
</footer>
<script src="js/main.js"></script>
</body>
</html>
